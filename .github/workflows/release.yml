name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Chinese resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          extra_system_packages: "fontconfig"

      - name: Compile English resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-en.tex
          latexmk_use_xelatex: true
          extra_system_packages: "fontconfig"

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify single-page PDFs
        run: |
          for f in resume resume-en; do
            if [ ! -s "$f.pdf" ]; then
              echo "Error: $f.pdf is missing or empty" >&2
              exit 1
            fi
            pages=$(pdfinfo "$f.pdf" | awk '/^Pages:/ {print $2}')
            echo "$f pages: $pages"
            if [ "$pages" != "1" ]; then
              echo "Error: expected a one-page $f.pdf, got $pages pages" >&2
              exit 1
            fi
          done

      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" resume.pdf resume-en.pdf \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preview HTML
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf
          cp resume-en.pdf public/resume-en.pdf
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Resume Preview</title>
            <style>
              html, body { margin: 0; background: #f5f5f5; }
              .lang-switch { position: sticky; top: 0; padding: 8px 16px; font-family: sans-serif; background: #fff; border-bottom: 1px solid #ddd; z-index: 10; }
              .lang-switch a { color: #0066cc; text-decoration: none; margin-right: 16px; }
              embed { display: block; width: 100%; height: 100vh; border: 0; }
            </style>
          </head>
          <body>
            <div class="lang-switch">
              <a href="#zh">↑ 中文版</a>
              <a href="#en">English ↓</a>
            </div>
            <embed id="zh" src="resume.pdf" type="application/pdf">
            <embed id="en" src="resume-en.pdf" type="application/pdf">
          </body>
          </html>
          HTML

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
