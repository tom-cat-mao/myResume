name: Build Resume

on:
  push:
    branches-ignore:
      - gh-pages
    tags-ignore:
      - "v*"
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Chinese resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          # 确保安装必要的包
          extra_system_packages: "fontconfig"
          # xu-cheng action 会自动处理 local fonts 如果在目录下，但显式指定更稳妥
          # 注意：extra_fonts 参数可能需要具体路径或者 zip，这里我们依赖 setting.cls 的相对路径加载
          # setting.cls 使用 Path = Font/，所以只要文件在工作区即可，不需要 extra_fonts 注入系统

      - name: Compile English resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume-en.tex
          latexmk_use_xelatex: true
          extra_system_packages: "fontconfig"

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Verify single-page PDFs and render previews
        run: |
          for f in resume resume-en; do
            if [ ! -s "$f.pdf" ]; then
              echo "Error: $f.pdf is missing or empty" >&2
              exit 1
            fi
            pdfinfo "$f.pdf"
            pdftotext -layout "$f.pdf" "$f.txt"
            pdftoppm -scale-to 1800 -png "$f.pdf" "$f-preview"
            pages=$(pdfinfo "$f.pdf" | awk '/^Pages:/ {print $2}')
            echo "$f pages: $pages" >> "$GITHUB_STEP_SUMMARY"
            if [ "$pages" != "1" ]; then
              echo "Error: expected a one-page $f.pdf, got $pages pages" >&2
              exit 1
            fi
          done

      - name: Upload PDF and preview artifacts
        if: always() && hashFiles('resume.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            resume.pdf
            resume-en.pdf
            resume-preview-*.png
            resume-en-preview-*.png
            resume.txt
            resume-en.txt
            resume.log
            resume-en.log
          retention-days: 7

      - name: Delete previous latest release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'latest';
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tag
                })).data.id
              });
            } catch (e) { console.log('No existing latest release to delete'); }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/' + tag
              });
            } catch (e) { console.log('No existing latest tag to delete'); }

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            resume.pdf
            resume-en.pdf
          tag_name: latest
          name: Latest Resume
          body: "Auto-generated resume from commit ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preview HTML
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf
          cp resume-en.pdf public/resume-en.pdf
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Resume Preview</title>
            <style>
              html, body { margin: 0; background: #f5f5f5; }
              .lang-switch { position: sticky; top: 0; padding: 8px 16px; font-family: sans-serif; background: #fff; border-bottom: 1px solid #ddd; z-index: 10; }
              .lang-switch a { color: #0066cc; text-decoration: none; margin-right: 16px; }
              embed { display: block; width: 100%; height: 100vh; border: 0; }
            </style>
          </head>
          <body>
            <div class="lang-switch">
              <a href="#zh">↑ 中文版</a>
              <a href="#en">English ↓</a>
            </div>
            <embed id="zh" src="resume.pdf" type="application/pdf">
            <embed id="en" src="resume-en.pdf" type="application/pdf">
          </body>
          </html>
          HTML

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
