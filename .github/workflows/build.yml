name: Build Resume

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          # 确保安装必要的包
          extra_system_packages: "fontconfig"
          # xu-cheng action 会自动处理 local fonts 如果在目录下，但显式指定更稳妥
          # 注意：extra_fonts 参数可能需要具体路径或者 zip，这里我们依赖 setting.cls 的相对路径加载
          # setting.cls 使用 Path = Font/，所以只要文件在工作区即可，不需要 extra_fonts 注入系统

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: resume.pdf
          retention-days: 7

      - name: Verify PDF
        run: |
          if [ ! -s resume.pdf ]; then
            echo "Error: resume.pdf is missing or empty" >&2
            exit 1
          fi
          echo "resume.pdf generated successfully ($(du -h resume.pdf | cut -f1))"

      - name: Delete previous latest release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'latest';
            try {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: (await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tag
                })).data.id
              });
            } catch (e) { console.log('No existing latest release to delete'); }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/' + tag
              });
            } catch (e) { console.log('No existing latest tag to delete'); }

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: resume.pdf
          tag_name: latest
          name: Latest Resume
          body: "Auto-generated resume from commit ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preview HTML
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf
          cat > public/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Resume Preview</title>
            <style>
              html, body { margin: 0; height: 100%; background: #f5f5f5; }
              embed { width: 100%; height: 100%; }
            </style>
          </head>
          <body>
            <embed src="resume.pdf" type="application/pdf">
          </body>
          </html>
          HTML

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: false
